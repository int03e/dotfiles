# --- CURSOR THEME ---
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = HYPRSHOT_DIR, /home/int03e/Pictures/Screenshots

# Brightness Control
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Volume Control
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Keyboard Backlight Cycle (Fn + Space)
bindl = , XF86KbdBrightnessCycle, exec, kbd-backlight-cycle

animations {
    enabled = true
    animation = workspaces, 0, 1, default
}

# --- INPUT ---
input {
    kb_layout = us,ua
    kb_options = grp:alt_shift_toggle
    touchpad {
        natural_scroll = false
        tap-to-click = true
        clickfinger_behavior = true
    }
}

monitor=eDP-1,2880x1800@120,0x0,2

misc {
    vrr = 1
}

# --- WINDOW RULES ---
windowrule = match:class ^(firefox)$, workspace 1
windowrule = match:class ^(kitty-ws2)$, workspace 2
windowrule = match:class ^(kitty-ws3)$, workspace 3
windowrule = match:class ^(mpv)$, workspace 4

# Utility Windows (Floating and Centered)
windowrule = match:class ^(blueman-manager|nm-connection-editor|pavucontrol)$, float 1
windowrule = match:class ^(blueman-manager|nm-connection-editor|pavucontrol)$, size 600 400
windowrule = match:class ^(blueman-manager|nm-connection-editor|pavucontrol)$, center 1

# --- KEYBINDINGS ---
$mainMod = SUPER 

# System Essentials
bind = $mainMod, Q, exec, kitty
bind = $mainMod, R, exec, noctalia msg panel-toggle launcher
bind = $mainMod, C, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, nautilus
bind = $mainMod, Print, exec, hyprshot -m window
bind = SHIFT, Print, exec, hyprshot -m region

# WINDOW MANAGEMENT
bind = $mainMod, V, togglefloating,          
bind = $mainMod, F, fullscreen, 0            
bind = $mainMod, P, pseudo,                  

# FOCUS & MOVING
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# RESIZING
binde = $mainMod ALT, right, resizeactive, 30 0
binde = $mainMod ALT, left, resizeactive, -30 0
binde = $mainMod ALT, up, resizeactive, 0 -30
binde = $mainMod ALT, down, resizeactive, 0 30

# WORKSPACES
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 
bind = $mainMod SHIFT, 7, movetoworkspace, 7

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# MOUSE BINDINGS
bindm = $mainMod, mouse:272, movewindow   
bindm = $mainMod, mouse:273, resizewindow 

# --- AUTOSTART & MISC ---
exec-once = hypridle
exec-once = swaync
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = kanshi 
exec-once = noctalia -d

# App Autostart
exec-once = [workspace 1 silent] firefox
exec-once = [workspace 2 silent] kitty --class kitty-ws2
exec-once = [workspace 3 silent] kitty --class kitty-ws3

# (Optional) Enable background blur for Noctalia's panels and bar
layerrule = match:namespace ^(noctalia-background-.*)$, blur 1
layerrule = match:namespace ^(noctalia-background-.*)$, ignore_alpha 0.5

general {
  gaps_in = 2
  gaps_out = 5
}

decoration {
  rounding = 10
  rounding_power = 2

  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

  blur {
    enabled = true
    size = 2
    passes = 2
    vibrancy = 0.1696
  }
}
